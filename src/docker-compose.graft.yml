services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: pitstop-graft-sqlserver
    ports:
      - "1434:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_PID=Developer
      - MSSQL_SA_PASSWORD=8jkGh47hnDw89H@q8LN2
    healthcheck:
      test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"8jkGh47hnDw89H@q8LN2\" -C -Q \"SELECT 1\" || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 20

  db-seed:
    image: mcr.microsoft.com/mssql-tools
    container_name: pitstop-graft-db-seed
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./db/seed.sql:/seed.sql:ro
    environment:
      - SQLCMDPASSWORD=8jkGh47hnDw89H@q8LN2
    entrypoint: ["/opt/mssql-tools/bin/sqlcmd", "-b", "-S", "sqlserver", "-U", "sa", "-i", "/seed.sql"]
    restart: "no"

  pitstop-grafthost:
    image: pitstop/grafthost:1.0
    build:
      context: .
      dockerfile: Pitstop.GraftHost/Dockerfile
    depends_on:
      db-seed:
        condition: service_completed_successfully
    ports:
      - "8090:80"
      - "8091:81"
    environment:
      - CUSTOMER_MANAGEMENT_CN=server=sqlserver,1433;user id=sa;password=8jkGh47hnDw89H@q8LN2;database=CustomerManagement;trustServerCertificate=true;
      - WORKSHOP_MANAGEMENT_CN=server=sqlserver,1433;user id=sa;password=8jkGh47hnDw89H@q8LN2;database=WorkshopManagement;trustServerCertificate=true;
